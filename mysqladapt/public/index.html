<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediTrack - Inicio de Sesión</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 7.5V16.5M7.5 12H16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>MediTrack</h1>
          <p>Medical Management</p>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <section class="login-wrapper">
        <div class="login-card">
          <div class="login-badge">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/>
              <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="login-header">
            <h2>Inicio de Sesión</h2>
            <p>Accede a tu panel médico</p>
          </div>

          <form class="login-form" id="loginForm">
            <div class="form-group">
              <label for="email">Correo Electrónico</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 7.5C4 6.67 4.67 6 5.5 6h13C19.33 6 20 6.67 20 7.5v9c0 .83-.67 1.5-1.5 1.5h-13C4.67 18 4 17.33 4 16.5v-9Z" stroke="currentColor" stroke-width="1.7"/>
                    <path d="M5 8l7 5 7-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
                <input type="email" id="email" placeholder="ejemplo@correo.com" />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M7.5 10V8.5a4.5 4.5 0 1 1 9 0V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/>
                    <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
                  </svg>
                </span>
                <input type="password" id="password" placeholder="••••••••" />
                <button class="toggle-password" type="button" aria-label="Mostrar contraseña">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/>
                    <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.7"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="helper-row">
              <a href="#">¿Olvidó su contraseña?</a>
            </div>

            <button class="submit-btn" type="submit">Iniciar Sesión</button>
          </form>

          <div class="divider"></div>

          <p class="bottom-text">
            ¿No tienes una cuenta?
            <a href="#">Contactar administrador</a>
          </p>
        </div>

        <p class="copyright">© 2024 MediTrack Web Solutions. Todos los derechos reservados.</p>
      </section>
    </main>
  </div>

  <script>
    const toggleBtn = document.querySelector('.toggle-password');
    const passwordInput = document.querySelector('#password');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    const loginForm = document.querySelector('#loginForm');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
